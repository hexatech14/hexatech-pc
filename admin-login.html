<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Administrateur | HexaTech</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
body{
    background:#f4f6f9;
}
.login-card{
    max-width:480px;
    margin:80px auto;
    padding:35px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.15);
}
.logo{
    font-size:60px;
}
</style>

</head>
<body>

<div id="menu"></div>

<div class="container">

<div class="login-card">

<div class="text-center mb-4">
<div class="logo">🔐</div>
<h1>Administration HexaTech</h1>
<p class="text-muted">Accès réservé à l'administrateur.</p>
</div>

<form>

<div class="mb-3">
<label class="form-label">Identifiant</label>
<input type="text" class="form-control" placeholder="Votre identifiant">
</div>

<div class="mb-3">
<label class="form-label">Mot de passe</label>
<input type="password" class="form-control" placeholder="Votre mot de passe">
</div>

<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" id="remember">
<label class="form-check-label" for="remember">
Se souvenir de moi
</label>
</div>

<div class="d-grid">
<a href="admin.html" class="btn btn-warning btn-lg">
Se connecter
</a>
</div>

<hr>

<div class="text-center">
<a href="index.html" class="btn btn-outline-secondary">
← Retour au site
</a>
</div>

<div class="alert alert-warning mt-4 mb-0">
<strong>Préparation :</strong> cette page sera reliée à une base de données lors de la mise en ligne sur un hébergement dynamique.
</div>

</form>

</div>

</div>

<div id="footer"></div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script src="footer.js"></script>
<script src="animations.js"></script>

</body>
</html>
