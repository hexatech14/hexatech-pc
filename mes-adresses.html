<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes adresses | HexaTech</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
.address-box{
max-width:1000px;
margin:40px auto;
background:#fff;
padding:35px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,.12);
}
</style>

</head>
<body>

<div id="menu"></div>

<div class="container">
<div class="address-box">

<h1 class="text-center mb-4">🏠 Mes adresses</h1>

<div class="alert alert-info">
Aucune adresse enregistrée pour le moment.
</div>

<h3 class="mt-4">Ajouter une adresse</h3>

<form>

<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Nom</label>
<input type="text" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Prénom</label>
<input type="text" class="form-control">
</div>
</div>

<div class="mb-3">
<label class="form-label">Adresse</label>
<input type="text" class="form-control">
</div>

<div class="row">
<div class="col-md-4 mb-3">
<label class="form-label">Code postal</label>
<input type="text" class="form-control">
</div>

<div class="col-md-8 mb-3">
<label class="form-label">Ville</label>
<input type="text" class="form-control">
</div>
</div>

<div class="mb-3">
<label class="form-label">Pays</label>
<input type="text" class="form-control" value="France">
</div>

<div class="form-check mb-4">
<input class="form-check-input" type="checkbox" id="defaut">
<label class="form-check-label" for="defaut">
Définir comme adresse de livraison par défaut
</label>
</div>

<div class="d-flex justify-content-between">
<a href="mon-compte.html" class="btn btn-outline-secondary">← Retour</a>
<button class="btn btn-warning" type="submit">Enregistrer l'adresse</button>
</div>

</form>

</div>
</div>

<div id="footer"></div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script src="footer.js"></script>
<script src="animations.js"></script>

</body>
</html>
