<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paramètres | Administration HexaTech</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.container-admin{max-width:1200px;margin:40px auto;}
.section-card{margin-bottom:25px;}
</style>
</head>
<body>

<div id="menu"></div>

<div class="container container-admin">

<div class="d-flex justify-content-between align-items-center mb-4">
<h1>⚙️ Paramètres HexaTech</h1>
<a href="dashboard.html" class="btn btn-outline-secondary">← Dashboard</a>
</div>

<div class="card section-card">
<div class="card-header fw-bold">🏢 Informations de l'entreprise</div>
<div class="card-body">
<div class="row">
<div class="col-md-6 mb-3">
<label>Nom de l'entreprise</label>
<input class="form-control" value="HexaTech">
</div>
<div class="col-md-6 mb-3">
<label>Slogan</label>
<input class="form-control" value="Des ordinateurs conçus pour durer.">
</div>
<div class="col-md-6 mb-3">
<label>Téléphone</label>
<input class="form-control" value="06 25 37 09 73">
</div>
<div class="col-md-6 mb-3">
<label>Email</label>
<input class="form-control" value="hexatech14@gmail.com">
</div>
<div class="col-md-12 mb-3">
<label>Adresse</label>
<input class="form-control" value="Puycornet (82220)">
</div>
</div>
</div>
</div>

<div class="card section-card">
<div class="card-header fw-bold">💳 Paiement</div>
<div class="card-body">
<div class="form-check">
<input class="form-check-input" type="checkbox" checked disabled>
<label class="form-check-label">Paiement SumUp</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" disabled>
<label class="form-check-label">Paiement CB (à venir)</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox" disabled>
<label class="form-check-label">PayPal (à venir)</label>
</div>
</div>
</div>

<div class="card section-card">
<div class="card-header fw-bold">🚚 Livraison</div>
<div class="card-body">
<ul>
<li>PC fixe : 39,90 €</li>
<li>PC portable : 19,90 €</li>
<li>Retrait atelier : Gratuit</li>
</ul>
</div>
</div>

<div class="card section-card">
<div class="card-header fw-bold">🌐 Réseaux sociaux</div>
<div class="card-body">
<input class="form-control mb-2" placeholder="Facebook">
<input class="form-control mb-2" placeholder="Instagram">
<input class="form-control mb-2" placeholder="YouTube">
<input class="form-control" placeholder="LinkedIn">
</div>
</div>

<div class="card section-card">
<div class="card-header fw-bold">🔍 SEO</div>
<div class="card-body">
<button class="btn btn-warning" disabled>Générer sitemap.xml</button>
<button class="btn btn-primary" disabled>Vérifier robots.txt</button>
<button class="btn btn-success" disabled>Optimisation SEO</button>
</div>
</div>

<div class="text-end">
<button class="btn btn-success" disabled>💾 Enregistrer les paramètres</button>
</div>

</div>

<div id="footer"></div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script src="footer.js"></script>
<script src="animations.js"></script>

</body>
</html>
