<header class="hero text-center">
<div class="container">
<h1>Contactez HexaTech</h1>
<p class="lead">Décrivez votre problème et je vous rappelle rapidement.</p>
</div>
</header>

<div class="container py-5">

<form action="https://formspree.io/f/xbdvdjkg" method="POST" class="card p-4 shadow mb-5">
<h3 class="mb-3">Demande d'intervention</h3>

<input class="form-control mb-3" name="Nom" placeholder="Nom et prénom" required>
<input class="form-control mb-3" type="tel" name="Téléphone" placeholder="Téléphone" required>
<input class="form-control mb-3" type="email" name="Email" placeholder="Adresse e-mail" required>
<input class="form-control mb-3" name="Marque" placeholder="Marque du PC">
<input class="form-control mb-3" name="Modele" placeholder="Modèle du PC">

<select class="form-select mb-3" name="Probleme">
<option>Ordinateur lent</option>
<option>Windows ne démarre plus</option>
<option>Virus</option>
<option>Changement SSD</option>
<option>Montage PC</option>
<option>PC reconditionné</option>
<option>Autre</option>
</select>

<textarea class="form-control mb-3" rows="5" name="Message" placeholder="Décrivez votre problème..." required></textarea>

<button class="btn btn-warning btn-lg">📨 Envoyer ma demande</button>
</form>
