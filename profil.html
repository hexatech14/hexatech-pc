<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon profil | HexaTech</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.profile-box{max-width:900px;margin:40px auto;background:#fff;padding:35px;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,.12);}
</style>
</head>
<body>

<div id="menu"></div>

<div class="container">
<div class="profile-box">

<h1 class="mb-4 text-center">👤 Mon profil</h1>

<form>

<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Prénom</label>
<input type="text" class="form-control" placeholder="Prénom">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Nom</label>
<input type="text" class="form-control" placeholder="Nom">
</div>
</div>

<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Adresse e-mail</label>
<input type="email" class="form-control" placeholder="email@exemple.fr">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Téléphone</label>
<input type="tel" class="form-control" placeholder="06 00 00 00 00">
</div>
</div>

<div class="mb-3">
<label class="form-label">Adresse</label>
<input type="text" class="form-control" placeholder="Votre adresse">
</div>

<div class="row">
<div class="col-md-4 mb-3">
<label class="form-label">Code postal</label>
<input type="text" class="form-control">
</div>

<div class="col-md-8 mb-3">
<label class="form-label">Ville</label>
<input type="text" class="form-control">
</div>
</div>

<hr>

<h3>Modifier le mot de passe</h3>

<div class="mb-3">
<label class="form-label">Nouveau mot de passe</label>
<input type="password" class="form-control">
</div>

<div class="mb-4">
<label class="form-label">Confirmer le mot de passe</label>
<input type="password" class="form-control">
</div>

<div class="d-flex justify-content-between">
<a href="mon-compte.html" class="btn btn-outline-secondary">← Retour</a>
<button type="submit" class="btn btn-warning">Enregistrer les modifications</button>
</div>

</form>

</div>
</div>

<div id="footer"></div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script src="footer.js"></script>
<script src="animations.js"></script>

</body>
</html>
