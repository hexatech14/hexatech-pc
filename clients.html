<!DOCTYPE html>

<div class="card shadow-sm mb-4">

<div class="row">
<div class="col-md-4">
<input type="text" class="form-control" placeholder="Rechercher un client...">
</div>

<select class="form-select">

<option>Particuliers</option>

</div>
</div>
</div>
</div>

Liste des clients
</div>

<div class="card-body">

<tr>
<th>ID</th>
<th>Nom</th>
<th>Email</th>
<th>Téléphone</th>
<th>Commandes</th>
<th>Garantie</th>

</thead>

<tbody>
<tr>
<td>#0001</td>
<td>Aucun client enregistré</td>

<td>-</td>
<td>0</td>
<td>-</td>
<td>

<button class="btn btn-sm btn-warning" disabled>Modifier</button>
</td>
</tr>
</tbody>

</table>

</div>
</div>

<div class="row mt-4">

<div class="col-md-3">
<div class="card text-center">
<div class="card-body">
<h5>Total clients</h5>
<h2>0</h2>

</div>
</div>

<div class="col-md-3">
<div class="card text-center">
<div class="card-body">
<h5>Nouveaux ce mois</h5>
<h2>0</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center">
<div class="card-body">
<h5>Clients actifs</h5>
<h2>0</h2>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center">
