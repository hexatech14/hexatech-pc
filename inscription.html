<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription | HexaTech</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.register-box{max-width:650px;margin:50px auto;padding:35px;background:#fff;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,.12);}
</style>
</head>
<body>

<div id="menu"></div>

<div class="container">
<div class="register-box">
<h1 class="text-center mb-4">Créer un compte</h1>

<form>

<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label">Prénom</label>
<input type="text" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Nom</label>
<input type="text" class="form-control" required>
</div>
</div>

<div class="mb-3">
<label class="form-label">Adresse e-mail</label>
<input type="email" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Téléphone</label>
<input type="tel" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Mot de passe</label>
<input type="password" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Confirmer le mot de passe</label>
<input type="password" class="form-control" required>
</div>

<div class="form-check mb-4">
<input class="form-check-input" type="checkbox" id="cgv" required>
<label class="form-check-label" for="cgv">
J'accepte les Conditions Générales de Vente et la Politique de confidentialité.
</label>
</div>

<div class="d-grid">
<button class="btn btn-warning btn-lg" type="submit">Créer mon compte</button>
</div>

<hr>

<p class="text-center mb-0">
Déjà client ?
<a href="connexion.html">Se connecter</a>
</p>

</form>
</div>
</div>

<div id="footer"></div>

<script src="config.js"></script>
<script src="menu.js"></script>
<script src="footer.js"></script>
<script src="animations.js"></script>

</body>
</html>
